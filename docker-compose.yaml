services:
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    container_name: openra-nginx-proxy
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
    networks:
      - openra
    ports:
      - 80:80

  jekyll:
    build: .
    container_name: openra-jekyll
    depends_on:
      - nginx-proxy
    volumes:
      - .:/srv/jekyll
      - /srv/jekyll/.bundle
      - /srv/jekyll/vendor
    networks:
      - openra
    expose:
      - 4000
    ports:
      - "35729:35729"
    environment:
      VIRTUAL_PORT: 4000
      VIRTUAL_HOST: localhost
    command: bundle exec jekyll serve --host 0.0.0.0 --livereload

networks:
  openra:
    driver: bridge
